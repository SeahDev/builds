# Sparkle (Instagram), built from efibalogh/sparkle-ig.
# Adapted from its buildapp.yml, without the draft release.
name: Sparkle
run-name: Sparkle ${{ inputs.ref || '(default branch)' }}

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: Direct link to the decrypted Instagram IPA
        required: true
        type: string
      ref:
        description: sparkle-ig tag, branch or commit to build (blank builds the default branch)
        default: ""
        type: string
      with_flex:
        description: Include libFLEX
        default: false
        type: boolean
      for_sidestore:
        description: Strip app extensions (for AltStore/SideStore free accounts)
        default: false
        type: boolean
      bundle_id:
        description: Bundle ID (blank keeps Instagram's)
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    # sparkle.icon uses Icon Composer 27 features, so this needs Xcode 27.
    runs-on: ${{ vars.MAC_RUNNER || 'xcode-27' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mask-inputs

      - name: Check out Sparkle
        uses: actions/checkout@v4
        with:
          repository: efibalogh/sparkle-ig
          ref: ${{ inputs.ref }}
          path: src
          submodules: recursive

      - uses: ./.github/actions/setup-tools
        with:
          brew: autoconf automake cmake libtool meson nasm ninja pkgconf wget yasm

      # Theos held at the commit upstream pins (newer Logos breaks bare %orig,
      # theos #114), with the iOS 16.2 SDK from xybp888/iOS-SDKs.
      - uses: ./.github/actions/setup-theos
        with:
          theos: theos-sparkle
          sdks: ios-sdks
          sdk: "16.2"

      - name: Download Instagram
        id: ipa
        uses: ./.github/actions/fetch-ipa
        with:
          url: ${{ inputs.ipa_url }}
          out: src/packages/com.burbn.instagram.ipa

      - name: Cache FFmpeg frameworks
        uses: actions/cache@v4
        with:
          path: |
            src/modules/ffmpegkit
            src/.cache/ffmpegkit
          key: ffmpegkit-${{ runner.os }}-${{ hashFiles('src/fetch-ffmpegkit.sh') }}

      - name: Prepare FFmpeg frameworks
        working-directory: src
        run: |
          chmod +x ./fetch-ffmpegkit.sh
          ./fetch-ffmpegkit.sh

      - name: Build the IPA
        working-directory: src
        env:
          WITH_FLEX: ${{ inputs.with_flex }}
          FOR_SIDESTORE: ${{ inputs.for_sidestore }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          # ipapatch at the release pinned in pins.json, checked against its SHA-256.
          pin() { jq -r ".ipapatch.$1" "$GITHUB_WORKSPACE/pins.json"; }
          curl -fsSLo ipapatch "https://github.com/$(pin repo)/releases/download/$(pin release)/$(pin asset)"
          echo "$(pin sha256)  ipapatch" | shasum -a 256 -c -
          chmod +x ipapatch
          export PATH=".:$PATH"
          flags=(--release)
          if [ "$FOR_SIDESTORE" = "true" ]; then flags+=(--no-ext); fi
          if [ "$WITH_FLEX" = "true" ]; then flags+=(--flex); fi
          if [ -n "$BUNDLE_ID" ]; then flags+=(--bundle-id "$BUNDLE_ID"); fi
          ./build.sh ipa "${flags[@]}"

      - name: Name the IPA
        id: out
        env:
          APP_VERSION: ${{ steps.ipa.outputs.version }}
          WITH_FLEX: ${{ inputs.with_flex }}
          FOR_SIDESTORE: ${{ inputs.for_sidestore }}
        run: |
          # build.sh names it Sparkle[_<flags>]_v<version>_IG_v<instagram version>.ipa;
          # rename it to <Tweak>_<tweak version>_<App>_<app version>[_<variant>].ipa.
          built="$(ls -t src/packages/Sparkle_*_IG_v*.ipa | head -n1)"
          version="$(awk '/^Version:/ {print $2; exit}' src/control)"
          name="Sparkle_${version}_Instagram_${APP_VERSION}"
          if [ "$WITH_FLEX" = "true" ]; then name="${name}_FLEX"; fi
          if [ "$FOR_SIDESTORE" = "true" ]; then name="${name}_no-extensions"; fi
          mv "$built" "src/packages/${name}.ipa"
          { echo "path=src/packages/${name}.ipa"; echo "name=${name}.ipa"; } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.out.outputs.name }}
          path: ${{ steps.out.outputs.path }}
          archive: false
          if-no-files-found: error
