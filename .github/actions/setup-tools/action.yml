name: Set up iOS tools
description: >
  Homebrew packages, GNU make first on PATH (Theos needs make 4), and cyan
  (pyzule-rw) for injecting tweaks into IPAs, at the commit pinned in pins.json.
inputs:
  brew:
    description: Extra Homebrew packages, space separated
    default: ""
  cyan:
    description: Install cyan
    default: "true"
runs:
  using: composite
  steps:
    - name: Install tools
      shell: bash
      env:
        EXTRA: ${{ inputs.brew }}
        CYAN: ${{ inputs.cyan }}
      run: |
        # shellcheck disable=SC2086
        brew install make ldid dpkg $EXTRA
        echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
        if [ "$CYAN" = "true" ]; then
          # Pinned in pins.json; Sidestash shows when there's a newer commit.
          repo=$(jq -r .cyan.repo "$GITHUB_WORKSPACE/pins.json")
          commit=$(jq -r .cyan.commit "$GITHUB_WORKSPACE/pins.json")
          pip install --force-reinstall "https://github.com/$repo/archive/$commit.zip" Pillow
        fi
